[package]
name = "saveshelf"
version = "0.1.0"
edition = "2021"
authors = ["Sameer Deolalikar"]
description = "Local, checksummed snapshots and non-overwriting restores for single-player game saves."
license = "MIT"
repository = "https://github.com/sameerdeolalikar/saveshelf"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
